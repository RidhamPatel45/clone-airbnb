# ==============================================================================
# Render Blueprint Specification
# Project: Airbnb Listing Page Clone (Full Stack)
# Services:
#   1. airbnb-backend: Node.js Express REST API
#   2. airbnb-frontend: Next.js Responsive Web Application
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. Backend REST API (Node.js / Express)
  # ----------------------------------------------------------------------------
  - type: web
    name: airbnb-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

  # ----------------------------------------------------------------------------
  # 2. Frontend Application (Next.js)
  # ----------------------------------------------------------------------------
  - type: web
    name: airbnb-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: airbnb-app
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: airbnb-backend
          property: host
